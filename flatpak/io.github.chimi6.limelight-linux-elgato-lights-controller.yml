# Release manifest. Builds the tagged source from GitHub.
# Not targeting Flathub, so the build is allowed network access (no vendored
# cargo sources to maintain). Bump `tag` on every release.
#
#   flatpak-builder --force-clean --user --install build-dir flatpak/io.github.chimi6.limelight-linux-elgato-lights-controller.yml
#   flatpak build-bundle ~/.local/share/flatpak/repo LimeLight.flatpak io.github.chimi6.limelight-linux-elgato-lights-controller
app-id: io.github.chimi6.limelight-linux-elgato-lights-controller
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: limelight
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # "Start on login" writes ~/.config/autostart/<app-id>.desktop on the host.
  - --filesystem=xdg-config/autostart:create

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  build-args:
    - --share=network
  env:
    CARGO_HOME: /run/build/limelight/cargo

modules:
  - name: limelight
    buildsystem: simple
    build-commands:
      - cargo build --manifest-path helper/Cargo.toml --release --locked -p keylightd -p keylight-gui
      - install -Dm755 helper/target/release/keylightd ${FLATPAK_DEST}/bin/keylightd
      - install -Dm755 helper/target/release/keylight-gui ${FLATPAK_DEST}/bin/limelight
      - install -Dm644 public/Limecon-256.png ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/io.github.chimi6.limelight-linux-elgato-lights-controller.png
      - install -Dm644 public/Limecon-512.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/io.github.chimi6.limelight-linux-elgato-lights-controller.png
      - install -Dm644 flatpak/io.github.chimi6.limelight-linux-elgato-lights-controller.desktop ${FLATPAK_DEST}/share/applications/io.github.chimi6.limelight-linux-elgato-lights-controller.desktop
      - install -Dm644 flatpak/io.github.chimi6.limelight-linux-elgato-lights-controller.metainfo.xml ${FLATPAK_DEST}/share/metainfo/io.github.chimi6.limelight-linux-elgato-lights-controller.metainfo.xml
      - install -Dm644 LICENSE ${FLATPAK_DEST}/share/licenses/io.github.chimi6.limelight-linux-elgato-lights-controller/LICENSE
    sources:
      - type: git
        url: https://github.com/Chimi6/limelight-linux-elgato-lights-controller.git
        tag: v0.3.1
