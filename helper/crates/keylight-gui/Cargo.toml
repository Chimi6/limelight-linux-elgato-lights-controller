[package]
name = "keylight-gui"
description = "LimeLight desktop GUI — controls Elgato lights via keylightd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[build-dependencies]
slint-build = "1.14"

[dependencies]
limelight-core.workspace = true
serde.workspace = true
serde_json.workspace = true
ureq.workspace = true
slint = { version = "1.14", default-features = false, features = [
  "std",
  "compat-1-2",
  "backend-winit",
  "renderer-femtovg",
  "accessibility",
] }
i-slint-backend-winit = { version = "1.14", default-features = false, features = ["renderer-femtovg"] }
winit = "0.30"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png"] }
